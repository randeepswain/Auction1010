version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auction_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: auction_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=auction_user
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=auction_db
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongo:27017/iob_db
    depends_on:
      - postgres
      - redis
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=http://localhost:3001

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mongo_data:
